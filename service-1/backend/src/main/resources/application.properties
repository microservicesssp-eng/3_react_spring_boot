spring.application.name=service-one
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/demo_one?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:demo_user}
spring.datasource.password=${DB_PASSWORD:demo_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

services.service2.url=${SERVICE2_URL:http://localhost:8081}
services.service2.retry-delay-ms=${SERVICE2_RETRY_DELAY_MS:3000}
